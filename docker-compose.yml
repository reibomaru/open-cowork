services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    volumes:
      - ./server/src:/app/server/src
      # pi-coding-agent の cwd (project scope) と html artifact の working dir。
      # ホストの ./workdir に bind mount してコンテナ再起動後も残るようにする。
      - ./workdir:/home/node/workdir
      # PI_AGENT_DIR。settings.json / auth.json / models.json / sessions/<file>.jsonl などの
      # pi-coding-agent 状態をホスト ./.pi-data に永続化し、再起動後も会話を resume できるようにする。
      - ./.pi-data:/home/node/.pi/agent
      # 共通 Skills (RO bind)。ローカルで `.pi/skills` 相当を別ディレクトリで配布する用途。
      # 使わないならコメントアウトして良い。
      - ./common-skills:/mnt/open-cowork-common:ro
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    extra_hosts:
      # ホストの Ollama (localhost:11434) にコンテナ内からアクセスするためのエイリアス
      - "host.docker.internal:host-gateway"
    environment:
      # pi-coding-agent のデフォルトプロバイダ。.env の MODEL_PROVIDER を透過する。
      - MODEL_PROVIDER=${MODEL_PROVIDER:-ollama}
      # Ollama ベース URL (Docker 内からホストへ)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Bash tool が spawn する shell。Dockerfile で `apk add bash` 済み。
      - SHELL=/bin/bash
      # pi-coding-agent の cwd + artifactStore の保存先を /home/node/workdir に揃える
      - CLAUDE_CWD=/home/node/workdir
      - WORKDIR_USER=/home/node/workdir
      # pi-coding-agent の設定 / セッションファイル保存先 (~/.pi/agent 相当)
      - PI_AGENT_DIR=/home/node/.pi/agent
      # 共通 Skills (RO bind) を pi-coding-agent (skillPaths) に伝える。
      # common-skills マウントを外す場合はこの行も外す。
      - WIZ_CLAUDE_COMMON_PLUGIN_PATH=/mnt/open-cowork-common
      # SearXNG (web search tool)
      - SEARXNG_BASE_URL=http://searxng:8080
      # DynamoDB Local を使う。AWS SDK v3 が尊重する標準 env で endpoint だけ差し替える。
      # 認証情報は dynamodb-init と同じ dummy で通る。
      - AWS_ENDPOINT_URL_DYNAMODB=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=ap-northeast-1
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      searxng:
        condition: service_started

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    # host port は意図的に bind しない。server コンテナから http://searxng:8080 で到達できれば十分。

  # ローカル開発用 DynamoDB。Sessions テーブルは server/.env の
  # DYNAMODB_TABLE_SESSIONS（既定: sessions-local）に対応する。
  #
  # host port は意図的に bind していない。複数 worktree で `pnpm dev` を並行起動した際に
  # 8000 が衝突して `port is already allocated` で server が落ちるのを防ぐため。
  # host から CLI で覗きたい場合は README 参照（docker compose run 経由）。
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    user: root
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb-local-data:/data

  # dynamodb-local 起動後に Sessions テーブル + LSI + TTL を idempotent に作成する。
  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    env_file:
      - ./server/.env
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ENDPOINT=http://dynamodb-local:8000
        TABLE="$${DYNAMODB_TABLE_SESSIONS:-sessions-local}"

        for i in $$(seq 1 30); do
          if aws dynamodb list-tables --endpoint-url "$$ENDPOINT" >/dev/null 2>&1; then
            break
          fi
          echo "waiting for dynamodb-local ($$i/30)..."
          sleep 1
        done

        if aws dynamodb describe-table --endpoint-url "$$ENDPOINT" --table-name "$$TABLE" >/dev/null 2>&1; then
          echo "table $$TABLE already exists"
          exit 0
        fi

        echo "creating table $$TABLE..."
        aws dynamodb create-table \
          --endpoint-url "$$ENDPOINT" \
          --table-name "$$TABLE" \
          --attribute-definitions \
              AttributeName=userId,AttributeType=S \
              AttributeName=sessionId,AttributeType=S \
              AttributeName=updatedAt,AttributeType=N \
          --key-schema \
              AttributeName=userId,KeyType=HASH \
              AttributeName=sessionId,KeyType=RANGE \
          --local-secondary-indexes '[{"IndexName":"SessionsByUpdatedAt","KeySchema":[{"AttributeName":"userId","KeyType":"HASH"},{"AttributeName":"updatedAt","KeyType":"RANGE"}],"Projection":{"ProjectionType":"INCLUDE","NonKeyAttributes":["title","status","model","createdAt","permissionMode","sdkSessionId"]}}]' \
          --billing-mode PAY_PER_REQUEST >/dev/null

        aws dynamodb update-time-to-live \
          --endpoint-url "$$ENDPOINT" \
          --table-name "$$TABLE" \
          --time-to-live-specification "Enabled=true, AttributeName=ttl" >/dev/null

        echo "table $$TABLE ready"

volumes:
  dynamodb-local-data:
